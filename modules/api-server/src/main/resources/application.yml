spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: user
    password: password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ecommerce-consumer
      auto-offset-reset: earliest

  # Java 25 Virtual Threads — Spring Boot 4에서 지원
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    org.jooq.tools.LoggerListener: DEBUG  # jOOQ SQL 쿼리 로그 (개발용)
